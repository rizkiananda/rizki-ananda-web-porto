<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizki Ananda — Software Developer</title>
    <meta name="description" content="Backend &amp; full-stack developer specializing in Laravel, Node.js, Golang and Vue.js. Building IoT platforms, POS and ERP systems since 2018." />
    <meta name="theme-color" content="#0B0F17" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%233B9DFF'/><text x='50' y='70' font-family='Space Grotesk,Segoe UI,sans-serif' font-size='58' font-weight='700' fill='%23081018' text-anchor='middle'>R</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      /* Paint the stored theme before first render so there is no flash. */
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
